# -- shell / behavior ------------------------------------------------------
shell /bin/zsh
confirm_os_window_close 0
copy_on_select          yes
scrollback_lines        10000
enable_audio_bell       no
mouse_hide_wait         2.0

# -- font ------------------------------------------------------------------
font_family      Annotation Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
disable_ligatures never
modify_font      cell_height 120%

# -- cursor (futuristic: beam + motion trail) ------------------------------
cursor_shape                 beam
cursor_beam_thickness        1.6
cursor_blink_interval        0
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# -- window / layout -------------------------------------------------------
hide_window_decorations    yes
window_padding_width       14
placement_strategy         top-left
remember_window_size       no
initial_window_width       120c
initial_window_height      34c
background_opacity         0.85
dynamic_background_opacity yes
background_blur            1

# -- tab bar (slanted powerline) -------------------------------------------
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    2
tab_title_template  "{index}  {title}"

# -- remote control (used by sync-theme.py to live-apply the theme) --------
allow_remote_control yes
listen_on            unix:@mykitty

# -- colors: generated from the active quickshell theme --------------------
# Regenerate with:  ~/.config/kitty/sync-theme.py
include theme.conf

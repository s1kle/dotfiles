# ==========================================================================
# Hyprlock Configuration
# Colors sourced from hyprlock-colors.conf, regenerated from the active
# quickshell theme by scripts/sync-hyprlock-theme.py (see shell.qml's
# Config.onThemeChanged hook). Layout/sizing/fonts here are hand-authored.
# ==========================================================================

source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path =
    color = rgba($background, 1.0)
    blur_passes = 0
}

label {
    monitor =
    text = $TIME
    color = rgba($text, 1.0)
    font_size = 90
    font_family = Inter, Outfit, Roboto, sans-serif
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %d")"
    color = rgba($textDim, 1.0)
    font_size = 20
    font_family = Inter, Outfit, Roboto, sans-serif
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    color = rgba($text, 0.85)
    font_size = 18
    font_family = Inter, Outfit, Roboto, sans-serif
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba($text, 0.15)
    inner_color = rgba($background, 0.70)
    font_color = rgb($text)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##$textDimHex"><i>Enter Password...</i></span>
    hide_input = false
    rounding = 14
    check_color = rgba(29, 185, 84, 0.85)
    fail_color = rgba(248, 113, 113, 0.85)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -90
    halign = center
    valign = center
}
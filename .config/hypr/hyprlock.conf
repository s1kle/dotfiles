# ==========================================================================
# Hyprlock Configuration
# Aligned with Quickshell Design Philosophy & Aesthetics
# ==========================================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $TIME
    color = rgba(226, 232, 240, 1.0)
    font_size = 90
    font_family = Inter, Outfit, Roboto, sans-serif
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %d")"
    color = rgba(148, 163, 184, 1.0)
    font_size = 20
    font_family = Inter, Outfit, Roboto, sans-serif
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    color = rgba(226, 232, 240, 0.85)
    font_size = 18
    font_family = Inter, Outfit, Roboto, sans-serif
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(226, 232, 240, 0.15)
    inner_color = rgba(15, 24, 35, 0.70)
    font_color = rgb(226, 232, 240)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##94a3b8"><i>Enter Password...</i></span>
    hide_input = false
    rounding = 14
    check_color = rgba(29, 185, 84, 0.85)
    fail_color = rgba(248, 113, 113, 0.85)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -90
    halign = center
    valign = center
}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Top Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <span class="time">21:00</span>
        <span class="track">song title - song name</span>

        <div class="widget weather"></div>
        <div class="widget music"></div>

        <div class="widget workspaces">
            <span>MONITOR 1</span>
            <div class="workspaces-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot dot--inactive"></div>
            </div>
        </div>

        <div class="widget workspaces workspaces--alt">
            <span>MONITOR 2</span>
            <div class="workspaces-dots">
                <div class="dot"></div>
                <div class="dot dot--inactive"></div>
                <div class="dot dot--inactive"></div>
            </div>
        </div>

        <div class="widget settings">
            <div class="slider">
                <span>MIC:</span>
                <div class="slider-track"><div class="slider-fill"></div></div>
            </div>
            <div class="slider">
                <span>BRI:</span>
                <div class="slider-track"><div class="slider-fill"></div></div>
            </div>
        </div>
    </div>
</body>
</html>
